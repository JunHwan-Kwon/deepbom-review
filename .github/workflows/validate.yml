name: Validate review package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run package
      - run: node scripts/check-distribution.mjs
      - uses: actions/setup-python@v6
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        if: runner.os == 'Linux'
        run: python -m pip install mlflow-skinny==3.16.1 onnxruntime==1.30.0 numpy==2.5.3 sqlalchemy==2.0.54 alembic==1.20.0
      - name: Run actual inference and MLflow integration
        if: runner.os == 'Linux'
        run: python test/integration_mlflow.py
      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ matrix.os }}
          path: dist/
